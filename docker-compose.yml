services:
  postgres:
    image: postgres:17-alpine
    container_name: wes-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wes
      POSTGRES_PASSWORD: wes
      POSTGRES_DB: wes
    volumes:
      - wes-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wes -d wes"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  wes-pgdata:
