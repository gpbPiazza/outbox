version: "2"
sql:
  - engine: "postgresql"
    queries: "wes/sql/queries.sql"
    schema: "infra/databases/sql/migrations"
    gen:
      go:
        package: "wesdb"
        out: "wes/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        rename:
          we: "Wes"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "json"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
